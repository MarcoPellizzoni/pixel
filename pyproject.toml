[project]
name = "pixel"
version = "0.2.0"
description = "Composable, step-based image processing with a pipe-style pipeline."
readme = "README.md"
authors = [
    { name = "MarcoPellizzoni", email = "marcopellizzoni@msn.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Background removal via segmentation neural networks (U^2-Net / IS-Net).
    "rembg[cpu]>=2.0.77",
    # `pymatting`, used by rembg for alpha matting, needs a version of numba
    # compatible with Python 3.12+.
    "numba>=0.61",
    # Processing algorithms: bilateral filter, Gaussians, CLAHE, median.
    "opencv-python-headless>=5.0.0.93",
    # Reading/writing image files and handling EXIF orientation.
    "pillow>=12.3.0",
    # Representation and vectorised computation over pixel matrices.
    "numpy>=2.4.6",
    # Command-line interface.
    "typer>=0.27.1",
    "flet[desktop,web]>=0.86.5",
]

[project.scripts]
# Installs the `pixel` command into the virtual environment.
pixel = "pixel.cli:main"
# Installs the `pixel-editor` command, which opens the graphical editor.
pixel-editor = "pixel.ui.launcher:run"

[dependency-groups]
dev = [
    "nodejs-wheel-binaries>=24.16.0",
    "pyright>=1.1.411",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Active checks: pycodestyle errors (E), pyflakes (F), import sorting (I),
# naming conventions (N), missing docstrings (D), syntax upgrades (UP).
select = ["E", "F", "I", "N", "D", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# In the tests the method name already describes the behaviour being checked:
# also demanding a docstring would add nothing but noise.
"tests/**" = ["D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyright]
# Pylance, the VS Code extension, is the closed-source build of this very same
# analysis engine: keeping the configuration here means the editor and the
# command line report exactly the same problems.
include = ["src", "tests"]
pythonVersion = "3.12"

# Pyright must analyse the code against the same libraries the program sees,
# otherwise it would not find numpy, cv2 and the other dependencies.
venvPath = "."
venv = ".venv"

# "strict" is the most severe level: on top of checking the declared types, it
# demands that none is left unknown. On a fully annotated codebase like this one
# the code already satisfies it, so the lower level ("standard", Pylance's
# default) would let defects through for nothing.
typeCheckingMode = "strict"

# The project's only suppressions are the two `rembg` import lines, since it
# ships no type annotations. Reporting the unnecessary ones stops them from
# lingering after the reason for them has gone away.
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
